<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Safari em Realidade Aumentada</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <style>
    html, body { margin:0; overflow:hidden; font-family:Arial,sans-serif; background:#000; }
    #hud { position:fixed; z-index:20; left:12px; right:12px; top:12px;
      background:rgba(0,0,0,.68); color:#fff; border-radius:14px;
      padding:10px 12px; text-align:center; pointer-events:none; }
    #hud strong { font-size:18px; display:block; }
    #hud span { font-size:13px; opacity:.92; }
    #status { position:fixed; z-index:20; left:50%; transform:translateX(-50%);
      bottom:18px; background:rgba(255,255,255,.92); color:#111;
      border-radius:999px; padding:9px 14px; font-size:14px; white-space:nowrap;
      pointer-events:none; }
  </style>
</head>
<body>
  <div id="hud"><strong id="nome">Safari RA</strong><span id="dica">Aponte a câmera para o marcador preto.</span></div>
  <div id="status">Procurando marcador…</div>

  <a-scene embedded vr-mode-ui="enabled:false"
    renderer="antialias:true; alpha:true"
    arjs="sourceType:webcam; debugUIEnabled:false; trackingMethod:best;">
    <a-marker id="marker" preset="hiro" emitevents="true" smooth="true"
      smooth-count="10" smooth-tolerance="0.01" smooth-threshold="5">

      <a-entity id="lion" visible="false" scale="0.9 0.9 0.9">
        <a-sphere position="0 0.65 0" radius="0.32" color="#9b5d20"></a-sphere>
        <a-sphere position="0 0.66 -0.02" radius="0.23" color="#d89a3a"></a-sphere>
        <a-sphere position="-0.17 0.84 0" radius="0.08" color="#d89a3a"></a-sphere>
        <a-sphere position="0.17 0.84 0" radius="0.08" color="#d89a3a"></a-sphere>
        <a-sphere position="-0.08 0.71 0.20" radius="0.025" color="#111"></a-sphere>
        <a-sphere position="0.08 0.71 0.20" radius="0.025" color="#111"></a-sphere>
        <a-cone position="0 0.62 0.22" radius-bottom="0.04" radius-top="0" height="0.07" rotation="90 0 0" color="#5b3524"></a-cone>
        <a-sphere position="0 0.28 0" radius="0.34" scale="1.25 0.7 0.65" color="#d89a3a"></a-sphere>
        <a-cylinder position="-0.18 0.03 0.12" radius="0.055" height="0.35" color="#d89a3a"></a-cylinder>
        <a-cylinder position="0.18 0.03 0.12" radius="0.055" height="0.35" color="#d89a3a"></a-cylinder>
        <a-cylinder position="-0.18 0.03 -0.12" radius="0.055" height="0.35" color="#d89a3a"></a-cylinder>
        <a-cylinder position="0.18 0.03 -0.12" radius="0.055" height="0.35" color="#d89a3a"></a-cylinder>
        <a-torus position="0.36 0.34 -0.10" radius="0.20" radius-tubular="0.025" rotation="0 75 0" color="#d89a3a"></a-torus>
      </a-entity>

      <a-entity id="elephant" visible="false" scale="0.9 0.9 0.9">
        <a-sphere position="0 0.34 0" radius="0.38" scale="1.35 .8 .8" color="#8f969c"></a-sphere>
        <a-sphere position="0 0.66 0.13" radius="0.27" color="#969da3"></a-sphere>
        <a-circle position="-0.25 0.68 0.11" radius="0.22" rotation="0 20 0" color="#7f878d" side="double"></a-circle>
        <a-circle position="0.25 0.68 0.11" radius="0.22" rotation="0 -20 0" color="#7f878d" side="double"></a-circle>
        <a-cylinder position="0 0.43 0.30" radius="0.055" height="0.48" rotation="70 0 0" color="#969da3"></a-cylinder>
        <a-sphere position="-0.09 0.72 0.34" radius="0.025" color="#111"></a-sphere>
        <a-sphere position="0.09 0.72 0.34" radius="0.025" color="#111"></a-sphere>
        <a-cylinder position="-0.22 0.03 0.14" radius="0.065" height="0.42" color="#8f969c"></a-cylinder>
        <a-cylinder position="0.22 0.03 0.14" radius="0.065" height="0.42" color="#8f969c"></a-cylinder>
        <a-cylinder position="-0.22 0.03 -0.14" radius="0.065" height="0.42" color="#8f969c"></a-cylinder>
        <a-cylinder position="0.22 0.03 -0.14" radius="0.065" height="0.42" color="#8f969c"></a-cylinder>
      </a-entity>

      <a-entity id="shark" visible="false" position="0 0.55 0" rotation="0 90 0">
        <a-sphere radius="0.32" scale="1.8 .65 .65" color="#547a91"></a-sphere>
        <a-cone position="-0.62 0 0" radius-bottom="0.22" radius-top="0" height="0.55" rotation="0 0 -90" color="#547a91"></a-cone>
        <a-cone position="0 0.26 0" radius-bottom="0.16" radius-top="0" height="0.32" color="#476c82"></a-cone>
        <a-cone position="0 -0.04 0.27" radius-bottom="0.13" radius-top="0" height="0.28" rotation="90 0 0" color="#476c82"></a-cone>
        <a-cone position="-0.70 0.18 0" radius-bottom="0.13" radius-top="0" height="0.32" rotation="0 0 -40" color="#476c82"></a-cone>
        <a-cone position="-0.70 -0.18 0" radius-bottom="0.13" radius-top="0" height="0.32" rotation="0 0 -140" color="#476c82"></a-cone>
        <a-sphere position="0.32 0.09 0.16" radius="0.022" color="#111"></a-sphere>
        <a-sphere position="0.32 0.09 -0.16" radius="0.022" color="#111"></a-sphere>
      </a-entity>

      <a-entity id="eagle" visible="false" position="0 0.48 0" scale=".9 .9 .9">
        <a-sphere radius="0.22" scale=".7 1.35 .7" color="#6f482d"></a-sphere>
        <a-sphere position="0 0.36 0.02" radius="0.16" color="#eee7d8"></a-sphere>
        <a-cone position="0 0.34 0.20" radius-bottom="0.06" radius-top="0" height="0.16" rotation="90 0 0" color="#d3a421"></a-cone>
        <a-sphere position="-0.055 0.40 0.14" radius="0.018" color="#111"></a-sphere>
        <a-sphere position="0.055 0.40 0.14" radius="0.018" color="#111"></a-sphere>
        <a-box position="-0.42 0.04 0" width=".65" height=".05" depth=".28" rotation="0 0 15" color="#5d3a25"></a-box>
        <a-box position="0.42 0.04 0" width=".65" height=".05" depth=".28" rotation="0 0 -15" color="#5d3a25"></a-box>
        <a-cone position="-0.08 -0.28 0" radius-bottom="0.08" radius-top="0" height="0.30" rotation="180 0 0" color="#6f482d"></a-cone>
        <a-cone position="0.08 -0.28 0" radius-bottom="0.08" radius-top="0" height="0.30" rotation="180 0 0" color="#6f482d"></a-cone>
      </a-entity>

      <a-plane rotation="-90 0 0" width="1.4" height="1.4" color="#ffffff" opacity="0.16"></a-plane>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

<script>
(function(){
  const data = {
    lion: { id:"lion", nome:"Leão", dica:"Mamífero terrestre • Observe a juba e o corpo." },
    elephant: { id:"elephant", nome:"Elefante", dica:"Mamífero terrestre • Observe a tromba e as orelhas." },
    shark: { id:"shark", nome:"Tubarão", dica:"Animal aquático • Observe as nadadeiras e o corpo alongado." },
    eagle: { id:"eagle", nome:"Águia", dica:"Ave • Observe as asas e o bico." }
  };
  const params = new URLSearchParams(location.search);
  const key = data[params.get("animal")] ? params.get("animal") : "lion";
  const selected = data[key];
  function ready(){
    Object.values(data).forEach(a => {
      const el = document.getElementById(a.id);
      if (el) el.setAttribute("visible", a.id === selected.id);
    });
    document.getElementById("nome").textContent = selected.nome + " em Realidade Aumentada";
    document.getElementById("dica").textContent = selected.dica;
    const marker = document.getElementById("marker");
    const status = document.getElementById("status");
    marker.addEventListener("markerFound", () => status.textContent = "Animal encontrado!");
    marker.addEventListener("markerLost", () => status.textContent = "Aponte novamente para o marcador.");
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", ready);
  else ready();
})();
</script>
</body>
</html>
